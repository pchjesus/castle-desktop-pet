<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>아킬라 메뉴</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#e7e9ef;font:12px/1.35 system-ui,'Malgun Gothic',sans-serif}
main{height:100%;padding:10px;background:#22262ef5;border:1px solid #515966;border-radius:12px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:9px}
header,footer,.row{display:flex;align-items:center;gap:7px}header strong{font-size:14px;flex:1}header button{width:25px;min-height:23px;background:transparent;border:0}
nav,.grid{display:grid;gap:5px;grid-template-columns:repeat(3,minmax(0,1fr))}nav{grid-template-columns:repeat(4,minmax(0,1fr))}nav button{min-height:29px;background:transparent;border-color:transparent;color:#aeb7c5}nav button[aria-selected=true]{background:#394353;color:white;border-color:#626f83}
section{min-height:0;overflow-y:auto}section[hidden]{display:none}h2{font-size:11px;margin:1px 0 4px;color:#b8c2d0;font-weight:500}h2:not(:first-child){margin-top:8px}p{margin:7px 0 0;color:#a6b0c0;font-size:11px}
button,select{font:inherit;color:#eff2f7;border:1px solid #535e70;background:#303949;border-radius:7px;cursor:pointer;min-height:30px;padding:5px}button{width:100%}button:hover,button:focus-visible,select:focus-visible{outline:1px solid #a6c5ef;background:#45536a}button[aria-pressed=true]{background:#315b7d;border-color:#72b2e4}small{display:block;font-size:10px;color:#afbbc9;margin-top:2px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.toggles button{min-height:39px}.poses button{min-height:43px}.stack{display:grid;gap:6px}.row label{white-space:nowrap;color:#b8c2d0}.row select{min-width:0;flex:1}.row button{width:32px;font-size:17px}
footer{border-top:1px solid #424d60;padding-top:6px;color:#9ca7b7;font-size:10px}footer span{flex:1}footer button{width:auto;min-height:24px;background:transparent;border:0;color:#edb0b0;padding:2px 8px}
</style></head><body><main>
<header><strong>아킬라</strong><button id="close-menu" aria-label="메뉴 닫기">×</button></header>
<nav role="tablist" aria-label="메뉴 분류"><button role="tab" id="tab-basic" data-tab="basic" aria-controls="panel-basic" aria-selected="true">기본</button><button role="tab" id="tab-frequency" data-tab="frequency" aria-controls="panel-frequency" aria-selected="false">빈도</button><button role="tab" id="tab-poses" data-tab="poses" aria-controls="panel-poses" aria-selected="false">동작</button><button role="tab" id="tab-more" data-tab="more" aria-controls="panel-more" aria-selected="false">더보기</button></nav>
<section id="panel-basic" role="tabpanel" aria-labelledby="tab-basic" data-panel="basic">
<h2>평소 자세</h2><div class="grid two"><button data-action="setting:base:smoking">흡연</button><button data-action="setting:base:idle">서 있기</button></div>
<h2>자동으로 할 일</h2><div class="grid toggles"><button id="autonomy-setting">움직임</button><button id="dialogue-setting">대사</button><button id="fire-setting">사격</button></div>
<h2>펫 크기</h2><div class="row"><button data-action="size:smaller" aria-label="펫 작게">−</button><select id="pet-size" aria-label="펫 크기"><option value="120" data-action="size:120">120 px</option><option value="140" data-action="size:140">140 px</option><option value="160" data-action="size:160">160 px</option><option value="180" data-action="size:180">180 px · 기본</option><option value="200" data-action="size:200">200 px</option><option value="240" data-action="size:240">240 px</option><option value="280" data-action="size:280">280 px</option><option value="320" data-action="size:320">320 px</option><option value="360" data-action="size:360">360 px</option></select><button data-action="size:larger" aria-label="펫 크게">+</button></div>
</section>
<section id="panel-frequency" role="tabpanel" aria-labelledby="tab-frequency" data-panel="frequency" hidden>
<h2>자동 움직임 간격</h2><div class="grid"><button data-action="setting:movementFrequency:quiet">조용히<small>5~10분</small></button><button data-action="setting:movementFrequency:default">보통<small>2~3분</small></button><button data-action="setting:movementFrequency:active">활발히<small>1~2분</small></button></div>
<h2>자동 대사 간격</h2><div class="grid"><button data-action="setting:dialogueFrequency:quiet">조용히<small>8~12분</small></button><button data-action="setting:dialogueFrequency:default">보통<small>4~6분</small></button><button data-action="setting:dialogueFrequency:active">활발히<small>2~3분</small></button></div><p>움직임과 대사를 각각 조절해요.</p>
</section>
<section id="panel-poses" role="tabpanel" aria-labelledby="tab-poses" data-panel="poses" hidden>
<h2>지금 실행할 동작</h2><div class="grid poses"><button data-action="pose:idle">서 있기</button><button data-action="pose:smoking">흡연</button><button data-action="pose:sitting">앉기</button><button data-action="pose:working">작업하기</button><button data-action="pose:speaking">말하기</button><button data-action="pose:drawing">총 꺼내기</button><button data-action="pose:firing">한 발 사격</button><button data-action="pose:dual_firing">양손 사격</button><button data-action="pose:firing_dynamic">허리 사격</button></div><p>앉기·작업 중 클릭해도 자세를 유지해요.</p>
</section>
<section id="panel-more" role="tabpanel" aria-labelledby="tab-more" data-panel="more" hidden>
<h2>이미지 검수 · 별도 창</h2><div class="stack"><button data-action="diagnostics">전체 이미지·비율 보기</button><button data-action="diagnostics:dual_firing">양손 사격 원본 비교</button><button data-action="diagnostics:firing_dynamic">허리 사격 원본 비교</button><button data-action="diagnostics:speaking_reference">대화 표정 7컷 보기</button></div><p>검수 도구는 배경이 있는 별도 창이에요.</p>
</section>
<footer><span>설정은 자동 저장돼요</span><button data-action="quit">펫 종료</button></footer>
</main><script>
const params=new URL(location.href).searchParams;
for(const [id,key,label] of [['autonomy-setting','autonomy','움직임'],['dialogue-setting','dialogueEnabled','대사'],['fire-setting','autoFire','사격']]){const button=document.getElementById(id);const enabled=params.get(key)!=='false';button.textContent=label+' '+(enabled?'켜짐':'꺼짐');button.dataset.action='setting:'+key+':'+String(!enabled);button.setAttribute('aria-pressed',String(enabled));}
for(const key of ['movementFrequency','dialogueFrequency'])for(const button of document.querySelectorAll('[data-action^="setting:'+key+':"]'))button.setAttribute('aria-pressed',String(button.dataset.action==='setting:'+key+':'+(params.get(key)||'default')));
for(const button of document.querySelectorAll('[data-action^="setting:base:"]'))button.setAttribute('aria-pressed',String(button.dataset.action==='setting:base:'+(params.get('base')||'smoking')));
document.querySelector('#pet-size').value=params.get('size')||'180';
function selectTab(name){for(const button of document.querySelectorAll('[data-tab]')){const selected=button.dataset.tab===name;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;}for(const panel of document.querySelectorAll('[data-panel]'))panel.hidden=panel.dataset.panel!==name;}
document.addEventListener('click',event=>{const tab=event.target.closest('[data-tab]');if(tab){selectTab(tab.dataset.tab);return;}const button=event.target.closest('button[data-action]');if(button)window.castleMenu?.invoke(button.dataset.action);});
document.querySelector('#pet-size').addEventListener('change',event=>window.castleMenu?.invoke('size:'+event.target.value));
document.querySelector('#close-menu').addEventListener('click',()=>window.castleMenu?.dismiss());
window.addEventListener('keydown',event=>{if(event.key==='Escape')window.castleMenu?.dismiss();if(event.target.matches('[data-tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const tabs=Array.from(document.querySelectorAll('[data-tab]'));const i=tabs.indexOf(event.target),next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length;selectTab(tabs[next].dataset.tab);tabs[next].focus();}});
document.addEventListener('contextmenu',event=>event.preventDefault());selectTab('basic');
</script></body></html>
