name: Reference sheet review thumbnails (non-runtime)
on:
  push:
    branches:
      - feat/v0.3c-action-pack
    paths:
      - .github/workflows/reference-sheet-review.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Render review-only JPEGs (preserve source sheets)
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          dest = Path("design/references/review")
          dest.mkdir(parents=True, exist_ok=True)
          for i in ("01", "02"):
              source = Path(f"design/references/akila-sheet-{i}.png")
              with Image.open(source) as im:
                  frame = im.convert("RGB")
              frame.thumbnail((1400, 1400), Image.Resampling.LANCZOS)
              target = dest / f"akila-sheet-{i}-preview.jpg"
              frame.save(target, "JPEG", quality=78, optimize=True, progressive=True)
              print(f"{target}: {frame.size}, {target.stat().st_size} bytes")
          PY
      - name: Commit derived review images to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/references/review/akila-sheet-01-preview.jpg design/references/review/akila-sheet-02-preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "chore(art): add temporary review-size reference images"
            git push origin HEAD:feat/v0.3c-action-pack
          fi
