name: Sync offline preview on v0.3C branch
on:
  push:
    branches:
      - feat/v0.3c-action-pack
    paths:
      - 'src/**'
      - 'preview-entry.html'
      - 'scripts/export-preview.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Regenerate single-file HTML preview
        run: npm run preview:export
      - name: Commit generated preview only if changed
        shell: bash
        run: |
          if git diff --quiet -- preview.html; then
            echo "Offline preview already matches source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- preview.html
          git commit -m "build: sync offline preview with renderer [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
