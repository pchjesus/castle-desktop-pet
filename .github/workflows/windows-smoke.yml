name: Windows build and export smoke
on:
  pull_request:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run preview:export
      - name: Verify committed offline HTML is reproducible on Windows
        run: git diff --exit-code -- preview.html
