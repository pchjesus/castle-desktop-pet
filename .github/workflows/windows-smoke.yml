name: Windows build and export smoke
on:
  pull_request:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'scripts/package-windows-qa.mjs'
      - 'scripts/export-preview.mjs'
      - 'preview-entry.html'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run preview:export
      - name: Verify committed offline HTML is reproducible on Windows
        run: git diff --exit-code -- preview.html
      - name: Create portable Windows QA folder
        run: node scripts/package-windows-qa.mjs
      - name: Verify package and launch smoke
        shell: pwsh
        run: |
          $qaSource = Join-Path $PWD 'dist-qa/CastlePetQA'
          $qaRoot = Join-Path $PWD 'dist-qa/검수 QA'
          Move-Item -LiteralPath $qaSource -Destination $qaRoot
          foreach ($name in @('electron.exe','resources/app/dist/index.html','resources/app/dist-electron/main.cjs','resources/app/dist-electron/pet-menu.html','resources/app/dist-electron/menu-preload.cjs','resources/app/preview.html','resources/app/preview-assets')) {
            if (!(Test-Path (Join-Path $qaRoot $name))) { throw "Missing package file: $name" }
          }
          $qaReport = Join-Path $PWD 'windows-qa-report.json'
          $qaProcess = Start-Process -FilePath (Join-Path $qaRoot 'electron.exe') -ArgumentList @('--qa-smoke','--qa-report',"`"$qaReport`"") -PassThru
          if (!$qaProcess.WaitForExit(30000)) { $qaProcess.Kill(); throw 'QA startup timed out' }
          if (Test-Path $qaReport) {
            Write-Host '=== Windows QA process report ==='
            Get-Content $qaReport -Raw | Write-Host
          } else { Write-Host 'Windows QA process report was not written.' }
          if ($qaProcess.ExitCode -ne 0) { throw "QA exit code $($qaProcess.ExitCode)" }
          $result = Get-Content $qaReport | ConvertFrom-Json
          if (!$result.passed -or !$result.petLoaded -or !$result.bReviewLoaded -or !$result.resizeChecked -or !$result.nativeFrameless.passed -or !$result.manualPoseChecked -or !$result.approvedPoseChecked.idle -or !$result.approvedPoseChecked.smoking -or !$result.approvedPoseChecked.sitting -or !$result.approvedPoseChecked.dual_firing -or $result.menuRequests -lt 1 -or $result.hitChanges -lt 1 -or !$result.mouseQa.success -or !$result.menuChrome.passed -or !$result.menuQA.hasSizing -or !$result.menuQA.hasPose -or !$result.menuQA.hasBlocked -or !$result.resizedFromMenu -or !$result.repeatChecked -or !$result.cancelledToIdle) { throw 'QA readiness failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: castle-pet-windows-qa-unapproved
          path: |
            dist-qa/검수 QA/
            windows-qa-report.json
          if-no-files-found: warn
