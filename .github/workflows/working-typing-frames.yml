name: Working finger frames from approved A-type art
on:
  push:
    branches:
      - feat/v0.3c-action-pack
    paths:
      - 'scripts/generate-typing-frames.py'
      - '.github/workflows/working-typing-frames.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: working-fingers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated image-generation dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 pillow==11.3.0 opencv-python-headless==4.12.0.88
      - name: Generate two precise typing-finger frames
        run: python scripts/generate-typing-frames.py
      - name: Ensure approved PNGs remain untouched
        run: git diff --exit-code -- src/characters/assets/akila src/characters/derived/akila/working/000.png src/characters/derived/akila/working/001.png
      - name: Save typing study and reproducibility report
        uses: actions/upload-artifact@v4
        with:
          name: v03c-working-finger-taps
          path: artifacts/working-typing-study/
          retention-days: 30
          if-no-files-found: error
      - name: Commit generated aligned PNGs only, to development branch
        shell: bash
        run: |
          git add -- src/characters/derived/akila/working/002.png src/characters/derived/akila/working/003.png
          if git diff --cached --quiet; then
            echo "No typing sprite changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "art: add localized approved Working typing sprites [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
