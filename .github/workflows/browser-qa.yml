name: v0.3C Browser QA
on:
  push:
    branches:
      - feat/v0.3c-action-pack
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/browser-qa.mjs'
      - 'preview-entry.html'
      - 'scripts/export-preview.mjs'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preview:export
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real Chromium preview QA
        run: node tests/browser-qa.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v03c-browser-qa
          path: artifacts/visual-qa/
          if-no-files-found: warn
