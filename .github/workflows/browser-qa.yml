name: v0.3C Browser QA
on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/browser-qa.mjs'
      - 'tests/b07-proportions-browser-qa.mjs'
      - 'tests/b10-browser-qa.mjs'
      - 'tests/b11-browser-qa.mjs'
      - 'tests/behavior-browser-qa.mjs'
      - 'preview-entry.html'
      - 'scripts/export-preview.mjs'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preview:export
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real Chromium preview QA
        run: node tests/browser-qa.mjs
      - name: B action review QA
        run: node tests/b-action-browser-qa.mjs
      - name: B07 proportion candidates comparison and note isolation
        run: node tests/b07-proportions-browser-qa.mjs
      - name: Review export and image cancellation QA
        run: node tests/b05-review-browser-qa.mjs
      - name: B10 candidate review
        run: node tests/b10-browser-qa.mjs
      - name: B11 candidate review
        run: node tests/b11-browser-qa.mjs
      - name: B13 behavior and pointer interaction
        run: node tests/behavior-browser-qa.mjs
      - name: File offline verification
        run: node tests/offline-preview-qa.mjs
      - name: Package offline review
        run: node scripts/package-preview.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v03c-browser-qa
          path: |
            artifacts/visual-qa/
            artifacts/offline-qa/
            artifacts/b-action-qa/
            artifacts/b05-review/
            artifacts/b07-review/
            artifacts/b10/
            artifacts/b11/
            artifacts/b13/
            preview-offline.zip
          if-no-files-found: warn
