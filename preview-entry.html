<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Castle Pet 미리보기</title></head><body><main><h1>캐슬 펫 미리보기</h1><div class="controls"><label>크기 <select id="size"><option>180</option><option selected>240</option><option>360</option></select> px</label><label>상태 <select id="state"></select></label><button data-dialogue="testPassed">테스트 통과 대사</button><button data-dialogue="deploymentComplete">배포 완료 대사</button><button id="replay">다시 재생</button><button id="reset">위치 초기화</button></div><p>캐릭터를 드래그하세요. 이미지가 없는 상태는 임시 화면으로 표시됩니다.</p><div id="desktop"><div id="pet"></div><div id="dialogue" aria-live="polite"></div><div class="taskbar">Windows 미리보기</div></div><section class="frame-review"><h2>프레임 비교</h2><p>원본 프레임을 크기 조절해 비교합니다. 정렬은 아직 적용되지 않았습니다.</p><label>상태 <select id="review-state"></select></label><button id="frame-prev">이전</button><button id="frame-next">다음</button><span id="frame-label"></span><div class="review-images"><img id="reference-frame" alt="기준 idle"><img id="selected-frame" alt="선택 프레임"></div></section></main><script type="module" src="/src/preview.ts"></script></body></html>
