<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Castle Pet 미리보기</title></head><body><main><h1>캐슬 펫 미리보기</h1><div class="controls"><label>크기 <select id="size"><option>180</option><option selected>240</option><option>360</option></select> px</label><label>상태 <select id="state"></select></label><button data-dialogue="testPassed">테스트 통과 대사</button><button data-dialogue="deploymentComplete">배포 완료 대사</button><label>속도 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="replay">다시 재생</button><button id="reset">위치 초기화</button></div><p>캐릭터를 드래그하세요. 이미지가 없는 상태는 임시 화면으로 표시됩니다.</p><div id="desktop"><div id="pet"></div><div id="dialogue" aria-live="polite"></div><div class="taskbar">Windows 미리보기</div></div><section class="frame-review"><h2>프레임 비교</h2><p>정렬본과 원본을 선택해 Idle 기준 이미지와 비교합니다. 동작은 아직 시각 검증 중입니다.</p><label>이미지 <select id="review-source"><option value="derived">정렬본</option><option value="original">원본</option></select></label><label>상태 <select id="review-state"></select></label><button id="frame-prev">이전</button><button id="frame-next">다음</button><span id="frame-label"></span><div class="review-images"><img id="reference-frame" alt="기준 idle"><img id="selected-frame" alt="선택 프레임"></div></section><section class="mustang-review"><h2>B형 독립 검수 · 미승인</h2><p>후보만 표시합니다. 실행 캐릭터는 A형이며 B형 각 상태는 별도 승인 전까지 미구현입니다.</p><label>후보 <select id="mustang-candidate"></select></label><label>크기 <select id="mustang-size"><option>180</option><option selected>240</option><option>360</option></select> px</label><label>배경 <select id="mustang-bg"><option value="checker">투명 격자</option><option value="light">밝게</option><option value="dark">어둡게</option></select></label><label><input type="checkbox" id="mustang-guides" checked> 기준선 표시</label><div class="mustang-panels"><figure><div class="mustang-panel"><img id="mustang-before" alt="기존 B형 후보"><span class="head-guide"></span><span class="foot-guide"></span></div><figcaption>정제 전 후보</figcaption></figure><figure><div class="mustang-panel"><img id="mustang-after" alt="선택한 B형 후보"><span class="head-guide"></span><span class="foot-guide"></span></div><figcaption>선택 후보 · 미승인</figcaption></figure></div><p>기준선은 캔버스의 상단 5%, 하단 95%를 나타내는 검수용 가이드이며 측정 확정값이 아닙니다.</p><p id="mustang-status"></p></section></main><script type="module" src="/src/preview.ts"></script></body></html>
