<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Castle Pet 미리보기</title></head><body><main><h1>캐슬 펫 미리보기</h1><div class="controls"><label>크기 <select id="size"><option>180</option><option selected>240</option><option>360</option></select> px</label><label>상태 <select id="state"></select></label><button data-dialogue="testPassed">테스트 통과 대사</button><button data-dialogue="deploymentComplete">배포 완료 대사</button><label>속도 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="replay">다시 재생</button><button id="reset">위치 초기화</button></div><p>캐릭터를 드래그하세요. 이미지가 없는 상태는 임시 화면으로 표시됩니다.</p><div id="desktop"><div id="pet"></div><div id="dialogue" aria-live="polite"></div><div class="taskbar">Windows 미리보기</div></div><section class="frame-review"><h2>프레임 비교</h2><p>정렬본과 원본을 선택해 Idle 기준 이미지와 비교합니다. 동작은 아직 시각 검증 중입니다.</p><label>이미지 <select id="review-source"><option value="derived">정렬본</option><option value="original">원본</option></select></label><label>상태 <select id="review-state"></select></label><button id="frame-prev">이전</button><button id="frame-next">다음</button><span id="frame-label"></span><div class="review-images"><img id="reference-frame" alt="기준 idle"><img id="selected-frame" alt="선택 프레임"></div></section></main><script type="module" src="/src/preview.ts"></script></body></html>
