</head><body><main><h1>캐슬 펫 미리보기</h1><div class="controls"><label>크기 <select id="size"><option>180</option><option selected>240</option><option>360</option></select> px</label><label>상태 <select id="state"></select></label><button data-dialogue="testPassed">테스트 통과 대사</button><button data-dialogue="deploymentComplete">배포 완료 대사</button><label>속도 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="replay">다시 재생</button><button id="reset">위치 초기화</button></div><p>캐릭터를 드래그하세요. 정식 출시 이전 B형 무스탕 QA를 표시합니다. 시각 검수 미완료 동작은 다른 의상으로 대체하지 않습니다.</p><div id="desktop"><div id="pet"></div><div id="dialogue" aria-live="polite"></div><div class="taskbar">Windows 미리보기</div></div><section class="canonical-review"><h2>2026-11-07 공식 B형 정제 검수 · 미승인</h2><p>공식 원본과 기술 후보를 비교합니다. 자동 검사 통과는 시각 승인이 아닙니다.</p><label>동작 <select id="canonical-action"></select></label><label>후보 버전 <select id="canonical-version"><option value="clean">정제 후보</option><option value="aligned">03 정렬 후보</option><option value="revised">04 기준점 보정 후보</option><option value="mask">04 수동 보정 마스크 (JPEG)</option></select></label><label>표정 프레임 <select id="canonical-speaking"></select></label><label>너비 <select id="canonical-size"><option>180</option><option selected>240</option><option>360</option></select> px</label><label>확대 <select id="canonical-zoom"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label>배경 <select id="canonical-bg"><option value="checker">격자</option><option value="light">흰색</option><option value="gray">회색</option><option value="dark">어두운 회색</option></select></label><label><input type="checkbox" id="canonical-guides" checked> 중심·머리·발 가이드</label><div class="canonical-panels"><figure><div class="canonical-panel"><img id="canonical-original" alt="공식 원본"><i></i><b></b><em></em></div><figcaption id="canonical-original-info"></figcaption></figure><figure><div class="canonical-panel"><img id="canonical-candidate" alt="미승인 정제 후보"><i></i><b></b><em></em></div><figcaption id="canonical-candidate-info"></figcaption></figure><figure><div class="canonical-panel"><img id="canonical-side-03" alt="03 후보"></div><figcaption>03 후보</figcaption></figure><figure><div class="canonical-panel"><img id="canonical-side-04" alt="04 후보"></div><figcaption>04 후보</figcaption></figure></div><p id="canonical-status"></p><p>가이드는 캔버스 비율 기준이며 실제 신체 기준점이 아닙니다. 표정 후보는 검은 배경이 남은 대략적 추출본입니다.</p></section></main></body></html>
