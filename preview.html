nical-panel"><img id="canonical-candidate" alt="미승인 정제 후보"><i></i><b></b><em></em></div><figcaption id="canonical-candidate-info"></figcaption></figure><figure><div class="canonical-panel"><img id="canonical-side-03" alt="03 후보"></div><figcaption>03 후보</figcaption></figure><figure><div class="canonical-panel"><img id="canonical-side-04" alt="04 후보"></div><figcaption>04 후보</figcaption></figure></div><p id="canonical-status"></p><p>가이드는 캔버스 비율 기준이며 실제 신체 기준점이 아닙니다. 표정 후보는 검은 배경이 남은 대략적 추출본입니다.</p></section></main></body></html>
